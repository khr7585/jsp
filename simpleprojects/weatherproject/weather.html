<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .weather-card {
            width: 320px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 75%;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            outline: none;
        }

        .search-box button {
            padding: 8px 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: white;
        }

        .weather-icon {
            font-size: 60px;
            margin: 15px 0;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
        }

        .description {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .details div {
            text-align: center;
        }

        .details span {
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="weather-card">

        <div class="search-box">
            <input type="text" placeholder="Enter city">
            <button>🔍</button>
        </div>

        <h2>Hyderabad</h2>

        <div class="weather-icon">☀️</div>

        <div class="temperature">32°C</div>
        <div class="description">Sunny</div>

        <div class="details">
            <div>
                🌬
                <span>12 km/h</span>
                Wind
            </div>

            <div>
                💧
                <span>60%</span>
                Humidity
            </div>
        </div>

        <div class="footer">
            Updated just now
        </div>

    </div>











    <script src="weather.js"></script>
</body>
</html>
