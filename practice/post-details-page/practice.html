<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" href="practice.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h2>MySocial</h2>
    <input type="text" placeholder="Search..." />
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Logout</a>
    </div>
  </nav>

  <!-- Main Layout -->
  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul>
        <li>🏠 Home</li>
        <li>👤 Profile</li>
        <li>💬 Messages</li>
      </ul>
    </aside>

    <!-- Feed -->
    <main class="feed">

      <!-- Create Post -->
      <div class="create-post">
        <input type="text" placeholder="What's on your mind?" />
        <button>Post</button>
      </div>

      <!-- Post Card -->
      <div class="post">
        <h4>Hemanth</h4>
        <p>This is my first post 🚀</p>
        <div class="actions">
          <span>❤️ Like</span>
          <span>💬 Comment</span>
        </div>
      </div>

      <div class="post">
        <h4>User2</h4>
        <p>Learning frontend development!</p>
        <div class="actions">
          <span>❤️ Like</span>
          <span>💬 Comment</span>
        </div>
      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
